[project]
name = "arcum-vol-engine"
version = "1.0.0"
description = "Arcum Volatility Engine: realized volatility pipeline, skew adjustment, and EIP-712 signer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.0.0",
    "eth-account>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vol_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
