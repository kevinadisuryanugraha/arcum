version: '3.8'

services:
  arcum-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: arcum-web-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - arcum-api

  arcum-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: arcum-bun-api
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - CHAIN_ID=4663
      - RPC_URL=https://rpc.mainnet.chain.robinhood.com
    healthcheck:
      test: ["CMD", "bun", "eval", "fetch('http://localhost:3002/v1/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  arcum-vol:
    build:
      context: .
      dockerfile: Dockerfile.vol
    container_name: arcum-vol-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CHAIN_ID=4663
